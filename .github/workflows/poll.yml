name: poll

# Every 30 minutes. GitHub cron drifts a few minutes under load; harmless here.
# Public repo => unlimited free Actions minutes, which is what makes the
# election-night high-frequency mode free as well.
#
# Two outputs per run:
#   * the secret gist       -- internal state and config (token model unchanged)
#   * a GitHub Pages mirror -- the READ path, because the analyst's scheduled-task
#     sandbox cannot reach gist.githubusercontent.com at all, and its fallback
#     route truncates large files mid-document.
# CADENCE EXPERIMENT (2026-07-30, owner-approved): */15 instead of */30.
# Measured under */30, GitHub load-shedding delivered 80-203 min between
# scheduled runs (median 140) with whole multi-hour windows dropped. Doubling
# the slots should tighten the edges of those windows; it will not fix the
# windows themselves. Evaluate after a few days by re-running the A9 interval
# analysis; revert if the median does not improve.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      universe:
        description: "Also refresh universe.json"
        type: boolean
        default: false
      scout:
        description: "Also run the scout sweep (heavy; normally daily)"
        type: boolean
        default: false

concurrency:
  group: desk-poll
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # The universe sweep is the analyst's discovery surface and only needs to
      # be fresh at the two brief times. This picks the runs nearest 07:30 and
      # 17:30 PT (14:30 and 00:30 UTC) so the file is warm when the brief fires.
      - name: Decide whether to refresh the universe
        id: mode
        run: |
          HOUR_UTC=$(date -u +%H); MIN_UTC=$(date -u +%M)
          FLAG=""
          if [ "${{ github.event.inputs.universe }}" = "true" ]; then FLAG="--universe"; fi
          if { [ "$HOUR_UTC" = "14" ] || [ "$HOUR_UTC" = "00" ]; } && [ "$MIN_UTC" -lt 15 ]; then
            FLAG="--universe"
          fi
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"

      - name: Poll
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_PREFIX: ${{ secrets.PAGES_PREFIX }}
          BRIEFS_TOPIC: ${{ secrets.BRIEFS_TOPIC }}
        run: python main.py ${{ steps.mode.outputs.flag }} --emit-site ./site

      # Scout runs once a day, on the run nearest 05:30 PT (12:30 UTC). It is a
      # full-board sweep plus per-market enrichment, so it is far heavier than a
      # poll and there is nothing it can learn from running every 30 minutes.
      - name: Decide whether to run the scout
        id: scout
        run: |
          HOUR_UTC=$(date -u +%H); MIN_UTC=$(date -u +%M)
          RUN=""
          if [ "${{ github.event.inputs.scout }}" = "true" ]; then RUN="yes"; fi
          if [ "$HOUR_UTC" = "12" ] && [ "$MIN_UTC" -lt 15 ]; then RUN="yes"; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Scout sweep
        if: steps.scout.outputs.run == 'yes'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGES_PREFIX: ${{ secrets.PAGES_PREFIX }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python tools/scout.py --emit-site ./site

      - name: Whale book
        if: steps.scout.outputs.run == 'yes'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tools/whale_book.py

      # Carry yesterday's scout pack forward on the ~47 runs a day that do not
      # rebuild it, or Pages would 404 the file for the analyst -- the same trap
      # universe.json fell into.
      - name: Carry the scout pack forward
        if: steps.scout.outputs.run != 'yes'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          PAGES_PREFIX: ${{ secrets.PAGES_PREFIX }}
        run: python tools/carry_scout.py --emit-site ./site

      # Fail loudly rather than deploying an empty site over a good one.
      - name: Verify the mirror was built
        env:
          PAGES_PREFIX: ${{ secrets.PAGES_PREFIX }}
        run: |
          DIR="./site/d/${PAGES_PREFIX}"
          test -s "$DIR/snapshot.json"   || { echo "::error::snapshot.json missing"; exit 1; }
          test -s "$DIR/brief-pack.json" || { echo "::error::brief-pack.json missing"; exit 1; }
          test -s ./site/robots.txt      || { echo "::error::robots.txt missing"; exit 1; }
          echo "mirror files: $(find "$DIR" -type f | wc -l)"
          echo "brief-pack:   $(wc -c < "$DIR/brief-pack.json") bytes"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # A failed job must still reach the phone -- spec 0.3, fail loud.
      - name: Report failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: Prediction desk: poll job FAILED" -H "Priority: 5" \
            -d "The scheduled poll workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

  deploy:
    needs: poll
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages allows one deployment at a time; queue rather than cancel, so a
    # 30-minute poll never discards a mirror it just built.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deploy failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: Prediction desk: Pages deploy FAILED" -H "Priority: 5" \
            -d "The snapshot published to the gist but the Pages mirror did not deploy. The analyst reads the mirror, so its next brief will be stale." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
