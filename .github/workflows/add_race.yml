name: add-race

# Add a race to the watchlist from a phone: GitHub app -> Actions -> add-race ->
# Run workflow, paste a ticker, done. Uses the existing GIST_TOKEN (gist scope
# only) and pushes an ntfy confirmation saying exactly what it did.
on:
  workflow_dispatch:
    inputs:
      market:
        description: "Kalshi ticker or kalshi.com URL (market, event or series)"
        required: true
      resolution_date:
        description: "YYYY-MM-DD. Leave blank to stage the race inactive (close_time is NOT a resolution date)"
        required: false
        default: ""
      polymarket_condition_id:
        description: "Optional 0x… condition id for the international reference book"
        required: false
        default: ""
      clip_size:
        description: "Contracts used for executable-price walks"
        required: false
        default: "150"
      dry_run:
        description: "Preview only — write nothing"
        type: boolean
        default: false

concurrency:
  # Serialise against itself and against the poll, since both write the gist.
  group: desk-gist-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Add the race
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python tools/add_race.py \
            --input "${{ github.event.inputs.market }}" \
            --resolution-date "${{ github.event.inputs.resolution_date }}" \
            --polymarket-condition "${{ github.event.inputs.polymarket_condition_id }}" \
            --clip-size "${{ github.event.inputs.clip_size }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Report failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: Prediction desk: add-race job FAILED" -H "Priority: 4" \
            -d "add-race failed for '${{ github.event.inputs.market }}'. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
