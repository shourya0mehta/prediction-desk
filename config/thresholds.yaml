# Non-sensitive alert defaults. Checked in deliberately: nothing here is private,
# and having it in git means threshold changes show up in the diff.
#
# A copy of this file placed in the gist as thresholds.yaml overrides these
# without a commit, which is the fast path for tuning during an election night.

clip_size_default: 150            # contracts walked when a watchlist row omits clip_size

# --- price movement (cents)
single_poll_move_cents: 4         # default-priority alert
single_poll_move_high_cents: 8    # high-priority alert
cumulative_move_cents: 7          # measured against the last 07:30/17:30 PT baseline

# --- flow
volume_spike_multiple: 3          # interval volume vs the 24h per-interval baseline
# A print must clear BOTH bars, not either one. With OR semantics this paged for
# $204 and $240 prints in production -- large in neither dollars nor relative
# terms. Both are halved automatically in election-night mode.
large_print_notional: 1000        # dollars, AND...
large_print_median_multiple: 10   # ...at least 10x this market's own trailing 24h median print

# --- cross-venue divergence
# NOT an arbitrage. The owner cannot trade the international Polymarket book, and
# segregated books carry persistent structural spreads, so this fires on movement
# away from the market's own 7-day median gap rather than on absolute level.
gap_dislocation_cents: 3

# --- whales
whale_notional_change: 500        # dollars of position value change worth waking up for

# --- delivery discipline
cooldown_minutes: 60              # per (market, trigger); a further full step re-fires
quiet_hours_min_move_cents: 10    # 23:00-07:00 PT floor, bypassed on election night
stale_snapshot_minutes: 120       # heartbeat fails past this

# --- election night (workflow_dispatch)
election_night_move_cents: 2

# --- scout layer (daily scout-pack.json) --------------------------------
horizon_days: 75                  # only races resolving inside this window

# Price band applies to the BUY-SIDE ASK -- what you would actually pay.
# Two tiers only: beyond a week the bar is 77c, because paying more than that
# for a binary needs an edge that rarely survives fees. Inside a week it rises
# to 85c, since a favourite at 80-85c settling in days is a different
# instrument -- short-dated and high-probability, the intended zone for that
# window rather than an accident.
band_ask_standard: 0.77
band_ask_near: 0.85
band_near_days: 7

stale_hours: 24
wide_spread_cents: 6
thin_volume_24h: 50
dead_tail_min_price: 0.05         # priced like a real chance...
dead_tail_max_raised: 25000       # ...funded like nobody

whale_consolidation_wallets: 2    # distinct tracked wallets, same side
whale_consolidation_usd: 2000     # combined net adds
whale_consolidation_days: 7
print_consolidation_count: 3      # same-side qualifying Kalshi prints
print_consolidation_hours: 72
print_consolidation_min_notional: 250
max_trade_lookups: 250            # per run; overflow reported, never silent
